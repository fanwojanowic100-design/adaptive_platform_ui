name: iOS Simulator Build (Appetize)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          cache: true
          cache-dependency-path: example/pubspec.lock

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Get Dependencies
        run: flutter pub get
        working-directory: example

      - name: Generate Flutter framework package
        run: flutter build swift-package --platform ios --build-mode release --no-codesign --output build/ios/SwiftPackages
        working-directory: example

      - name: Link Flutter framework package
        run: |
          framework_package=example/build/ios/SwiftPackages/FlutterNativeIntegration/Release/Packages/FlutterFramework
          test -d "$framework_package"
          ln -s "../$framework_package" ios/FlutterFramework

      - name: Build iOS Simulator app
        run: flutter build ios --simulator --release
        working-directory: example

      - name: Package app for Appetize
        run: |
          app_path=$(find build/ios/iphonesimulator -maxdepth 1 -type d -name '*.app' -print -quit)
          if [[ -z "$app_path" ]]; then
            echo "No iOS Simulator .app was produced." >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$app_path" build/ios/appetize-ios-simulator.zip
        working-directory: example

      - name: Upload Appetize app
        uses: actions/upload-artifact@v4
        with:
          name: appetize-ios-simulator
          path: example/build/ios/appetize-ios-simulator.zip
          if-no-files-found: error
