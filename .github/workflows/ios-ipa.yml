name: iOS IPA Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          cache: true
          cache-dependency-path: example/pubspec.lock

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Get Dependencies
        run: flutter pub get
        working-directory: example

      - name: Generate Flutter framework package
        run: flutter build swift-package --platform ios --build-mode release --no-codesign --output build/ios/SwiftPackages
        working-directory: example

      - name: Link Flutter framework package
        run: |
          framework_package=example/build/ios/SwiftPackages/FlutterNativeIntegration/Release/Packages/FlutterFramework
          test -d "$framework_package"
          ln -s "../$framework_package" ios/FlutterFramework

      - name: Build IPA
        run: flutter build ipa --release --no-codesign
        working-directory: example

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: example/build/ios/ipa/*.ipa
          if-no-files-found: error
